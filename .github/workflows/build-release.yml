name: Build & Package Release Executables

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Standalone Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Web Bundle
        run: npm run build

      - name: Run Protocol Driver Test Suite
        run: npx tsx test/protocol.test.ts

      - name: Package & Publish Standalone Windows Executables to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --x64 --publish always

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Project-Studio-Windows-x64
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 30
